name: ci

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - name: Run with no API key
        run: python run.py
      - run: python validate.py
      - run: pytest
      - name: Committed artifacts match a fresh run
        run: git diff --exit-code -- outputs/

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_eval
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag_eval" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/rag_eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt "psycopg[binary]==3.2.10"
      - run: python run.py
      - run: python validate.py
      - name: Every table has rows
        run: |
          for t in runs agent_tasks kb_docs queries candidate_answers retrievals rule_checks prompt_templates llm_requests llm_reviews picks recommendations; do
            n=$(psql "$DATABASE_URL" -tAc "select count(*) from $t"); echo "$t $n"; test "$n" -gt 0
          done
