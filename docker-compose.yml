services:
  postgres:
    image: postgres:17
    container_name: rag-eval-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag_eval
    ports:
      - "127.0.0.1:5446:5432"
    volumes:
      - rag-eval-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_eval"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  rag-eval-pgdata:
